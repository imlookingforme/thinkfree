services:
  - type: web
    name: thinkfree
    runtime: python
    region: oregon
    plan: free
    healthCheckPath: /api/v1/health
    buildCommand: npx --yes pnpm install && npx --yes pnpm --filter @thinkfree/shared build && npx --yes pnpm --filter @thinkfree/web build && pip install ./apps/api
    startCommand: uvicorn app.main:app --app-dir apps/api --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: thinkfree-db
          property: connectionString
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: raghuramvedantam16@gmail.com
      - key: SMTP_PASSWORD
        value: sfev qmku kjlp qphf
      - key: SMTP_FROM
        value: raghuramvedantam16@gmail.com

databases:
  - name: thinkfree-db
    plan: free
    region: oregon
    databaseName: thinkfree
    user: thinkfree_user

services:
  - type: web
    name: thinkfree
    runtime: python
    region: oregon
    plan: free
    buildCommand: corepack enable && pnpm --filter @thinkfree/web build && pip install -r apps/api/pyproject.toml
    startCommand: uvicorn app.main:app --app-dir apps/api --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
